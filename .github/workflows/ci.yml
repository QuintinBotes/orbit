name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything the tests exercise for real is installed before they run, so a
      # missing tool fails here with a clear message instead of as a test failure.
      - name: Sandbox prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Install the Claude Code CLI (plugin validation and the plugin tests)
        run: npm install --global @anthropic-ai/claude-code

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Fault-injection tests
        run: npm run test:fault

      - name: Acceptance tests (mock providers)
        run: npm run test:acceptance

      - name: Committed bundle matches the sources
        run: npm run check:dist

      - name: Plugin validation
        run: node scripts/check-plugin.mjs
