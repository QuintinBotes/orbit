name: diag 181 (temporary)

on:
  push:
    branches: [goal/181-ubuntu-2604]

permissions: {}

jobs:
  apparmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          npm install --global @anthropic-ai/claude-code
      - name: Measure
        run: |
          set +e
          cat /etc/os-release | head -3; uname -a; bwrap --version; ls -l "$(command -v bwrap)"; claude --version
          for k in kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined kernel.unprivileged_userns_apparmor_policy kernel.unprivileged_userns_clone; do sysctl $k; done
          sudo aa-status 2>&1 | grep -iE 'bwrap|userns|profiles are'
          ls /etc/apparmor.d | grep -iE 'bwrap|userns'
          echo '--- bwrap-userns-restrict'; cat /etc/apparmor.d/bwrap-userns-restrict
          echo '--- unprivileged_userns'; cat /etc/apparmor.d/unprivileged_userns
          repo=$(mktemp -d); git -C "$repo" init -q
          probe() {
            echo "=================== $1"
            (cd "$repo" && node "$GITHUB_WORKSPACE/plugin/dist/orbit.mjs" doctor --json > /tmp/doctor.json)
            node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/doctor.json"));for(const c of d.checks) if(c.id==="isolation") console.log("doctor isolation:", c.status, "|", c.summary, "|", c.fix ?? "")'
            npx vitest run tests/integration/adapters/worker-background.test.ts > /tmp/vt.log 2>&1; echo "claude-sandbox test exit $?"
            grep -aE 'Tests |apply-seccomp|bwrap:|✓|×' /tmp/vt.log | head -12
          }
          probe "A stock"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          probe "B sysctl restrict_unprivileged_userns=0 only"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          probe "C bwrap-userns-restrict unloaded only"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          probe "D unloaded and sysctl 0"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' > /tmp/bwrap-unconfined
          sudo apparmor_parser -r /tmp/bwrap-unconfined
          sudo aa-status 2>&1 | grep -iE 'bwrap'
          probe "E bwrap profile replaced by unconfined+userns, sysctl 1"
          sudo apparmor_parser -R /tmp/bwrap-unconfined
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          probe "A2 stock again"
          true
