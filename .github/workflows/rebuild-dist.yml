name: Rebuild dist

# Pull requests do not commit plugin/dist or the plugin copies of the documentation (#230). After each merge into next
# this rebuilds them once; when they are stale it pushes a branch and opens one pull request, which the owner admin
# merges. Nothing is pushed when they are already up to date. A pull request opened with the workflow token starts no CI
# of its own; the push to next after its merge runs the check:dist gate in ci.yml.

on:
  push:
    branches: [next]

permissions: {}

concurrency:
  group: rebuild-dist
  cancel-in-progress: false

jobs:
  rebuild:
    name: rebuild the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the rebuild branch
      pull-requests: write # open its pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and open a pull request when the bundle is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard plugin)" ]; then
            echo "plugin/dist and the plugin documentation are up to date; nothing to do."
            exit 0
          fi
          branch="automation/rebuild-dist"
          git checkout -b "$branch"
          git add plugin
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "Rebuild plugin/dist after ${GITHUB_SHA::7}"
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --base next --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base next --head "$branch" \
              --title "Rebuild plugin/dist" \
              --body "Rebuilt from next at $GITHUB_SHA by .github/workflows/rebuild-dist.yml."
          fi
