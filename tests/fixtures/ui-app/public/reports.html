<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports</title>
    <link rel="stylesheet" href="/styles.css" />
    <!--EXTRA-->
  </head>
  <body>
    <main>
      <h1>Reports</h1>
      <div class="toolbar">
        <!--LABEL-->
        <select id="status" name="status">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="closed">Closed</option>
          <option value="draft">Draft</option>
        </select>
        <button id="export" type="button">Export CSV</button>
      </div>
      <p id="count" role="status">Loading</p>
      <table>
        <caption class="visually-hidden">Reports</caption>
        <thead><tr><th scope="col">ID</th><th scope="col">Name</th><th scope="col">Status</th><th scope="col">Amount</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="footer-note">Figures are synthetic test data.</p>
    </main>
    <!--CONFIG-->
    <script src="/app.js"></script>
  </body>
</html>
